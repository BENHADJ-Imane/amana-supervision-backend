spring.application.name=amana-supervision-backend

# Connexion a la base de donnees PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/amana_supervision
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA / Hibernate
# "update" = cree/modifie automatiquement les tables selon nos classes Java
# (pratique en developpement, a ne jamais utiliser en production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port du serveur backend (8080 par defaut, on le garde explicite)
server.port=8080